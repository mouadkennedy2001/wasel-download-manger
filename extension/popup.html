<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send to Wasel</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img class="brand-mark" src="icons/icon48.png" alt="">
        <div>
          <strong>Wasel</strong>
          <span class="status"><i id="bridgeDot"></i><span id="bridgeText">Checking…</span></span>
        </div>
      </header>
      <label for="downloadUrl">Links</label>
      <textarea id="downloadUrl" rows="3" spellcheck="false" placeholder="https://example.com/file.zip"></textarea>
      <p id="message" role="status" aria-live="polite"></p>
      <button id="send" type="button">Send to Wasel</button>
      <label class="capture-setting" for="captureDownloads">
        <input id="captureDownloads" type="checkbox">
        <span>Take over browser downloads</span>
      </label>
      <footer>Wasel asks before adding links from the browser. Your sign-in session is sent only to Wasel on this computer.</footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
